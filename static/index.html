<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Embedder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Text Embedder</h1>
        <form id="embed-form">
            <textarea id="text-input" placeholder="Type some text..." rows="4" required></textarea>
            <button type="submit">Embed</button>
        </form>
        <section id="result" hidden>
            <div id="meta"></div>
            <pre id="vector"></pre>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
