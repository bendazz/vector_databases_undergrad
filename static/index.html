<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Similarity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Text Similarity</h1>
        <form id="similarity-form">
            <textarea id="text-input-1" placeholder="First text..." rows="4" required></textarea>
            <textarea id="text-input-2" placeholder="Second text..." rows="4" required></textarea>
            <button type="submit">Compare</button>
        </form>
        <section id="result" hidden>
            <div id="meta"></div>
            <div id="similarity"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
